<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: título e controles em cima; cena 3D ocupa o resto, com a lista de cômodos ao lado (desktop) ou embaixo (celular) */
:root {
  --bg: #eceeea;
  --surface: #f9faf8;
  --fg: #1c2220;
  --muted: #5b6561;
  --line: #d2d7d2;
  --accent: #1f6a64;
  --accent-fg: #ffffff;
  --scene: #dfe7ea;
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Figtree", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b211f; --fg: #e6ebe8; --muted: #98a39e; --line: #2d3532;
    --accent: #5fb2a9; --accent-fg: #0c1412; --scene: #1c2427; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b211f; --fg: #e6ebe8; --muted: #98a39e; --line: #2d3532;
  --accent: #5fb2a9; --accent-fg: #0c1412; --scene: #1c2427; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
header > *, .controles > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); }
.controles { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grupo > span { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; border: 0; background: transparent; color: var(--fg); padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:disabled { color: var(--muted); cursor: default; opacity: .5; }
.seg button:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.amostra { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); display: inline-grid; place-items: end; overflow: hidden; }
.amostra i { display: block; width: 7px; height: 9px; }
.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--fg); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 12px; }
#cena { position: relative; min-height: 0; min-width: 0; border-radius: 10px; overflow: hidden; background: var(--scene); border: 1px solid var(--line); }
#cena canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.dica { position: absolute; left: 10px; right: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
aside { min-width: 0; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
aside h2 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
li .nome { display: flex; align-items: center; gap: 7px; min-width: 0; }
li .cor { flex: none; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--line); }
li.total { font-weight: 600; border-bottom: 0; }
dl { margin: 0; display: grid; gap: 8px; }
dt { font-weight: 600; }
dd { margin: 2px 0 0; color: var(--muted); line-height: 1.4; }
.nota { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 12px 0 0; }
@media (max-width: 760px) {
  html, body { height: auto; min-height: 100%; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
}
</style>

<header>
  <h1>Casa 3D</h1>
  <span class="sub">Lote 15 × 8 m · colonial pernambucano com linhas de hoje</span>
</header>

<div class="controles">
  <div class="grupo"><span>Opção</span>
    <div class="seg" id="cenarios">
      <button id="c-atual" data-c="atual">Hoje</button>
      <button id="c-reforma" data-c="reforma">Reforma</button>
      <button id="c-sobrado" data-c="sobrado">Sobrado</button>
    </div>
  </div>
  <div class="grupo"><span>Andar</span>
    <div class="seg" id="andares">
      <button id="a-todos" data-a="todos">Todos</button>
      <button id="a-0" data-a="0">Térreo</button>
      <button id="a-1" data-a="1">1º andar</button>
    </div>
  </div>
  <div class="grupo"><span>Fachada</span>
    <div class="seg" id="fachadas"></div>
  </div>
  <label class="chk"><input type="checkbox" id="telhado" checked> Telhado</label>
  <label class="chk"><input type="checkbox" id="moveis" checked> Móveis</label>
  <label class="chk"><input type="checkbox" id="separar"> Separar andares</label>
  <label class="chk"><input type="checkbox" id="baixas"> Paredes baixas</label>
  <label class="chk"><input type="checkbox" id="rotulos"> Nomes</label>
  <label class="chk"><input type="checkbox" id="cores"> Cores da planta</label>
</div>

<main>
  <div id="cena"><span class="dica">Arraste para girar · pinça ou roda para zoom · desmarque Telhado para ver dentro</span></div>
  <aside id="lista"></aside>
</main>

function tela(px, desenhar) {

  desenhar(cv.getContext("2d"), px);
  return cv;
}
function variar(base, amp) {
  const c = new THREE.Color(base), d = (Math.random() - 0.5) * amp;
  return `rgb(${[c.r, c.g, c.b].map(v => Math.max(0, Math.min(255, Math.round((v + d) * 255)))).join(",")})`;

  // azulejo português azul e branco, peças de 15 cm (a imagem cobre 60 cm)
  azulejo: { m: 0.6, cv: tela(256, (g, n) => {

// ---------- materiais ----------
const cache = {};
function mat(cor, opts = {}) {
  const k = "c" + cor + JSON.stringify(opts);
  return cache[k] || (cache[k] = new THREE.MeshLambertMaterial({ color: cor, ...opts }));
}
// material com textura repetida para cobrir larg × alt metros
function matTex(nome, larg, alt, cor = 0xffffff, opts = {}) {
  const img = IMAGENS[nome];
  const rx = +(larg / img.m).toFixed(2), ry = +(alt / img.m).toFixed(2);
  const k = `t${nome}|${rx}|${ry}|${cor}|${JSON.stringify(opts)}`;
  if (cache[k]) return cache[k];
  const tex = new THREE.CanvasTexture(img.cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(rx, ry);
  tex.anisotropy = maxAniso;
  return (cache[k] = new THREE.MeshLambertMaterial({ map: tex, color: cor, ...opts }));
}
const vidro = () => mat(COR.vidro, { transparent: true, opacity: 0.35 });
const fachada = () => FACHADAS[estado.fachada];

// ---------- geometria básica ----------
function addMesh(geo, material, sombra = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = sombra && !material.transparent;
  m.receiveShadow = true;
  grupo.add(m);
  return m;
}
// caixa em coordenadas da planta: x → x, y da planta → z, altura → y
function caixa(x0, x1, z0, z1, y0, y1, material) {
  const m = addMesh(new THREE.BoxGeometry(Math.max(x1 - x0, 0.001), Math.max(y1 - y0, 0.001), Math.max(z1 - z0, 0.001)), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return m;
}
// caixa sobre uma linha de parede: o = "h" (corre em x, na posição z = v) ou "v" (corre em z, na posição x = v)
function naLinha(o, v, a, b, y0, y1, off, esp, material) {
  const c = v + off;
  return o === "h" ? caixa(a, b, c - esp / 2, c + esp / 2, y0, y1, material) : caixa(c - esp / 2, c + esp / 2, a, b, y0, y1, material);
}

function juntar(iv) {
  iv = iv.map(p => [Math.min(...p), Math.max(...p)]).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [a, b] of iv) {
    const u = out[out.length - 1];
    if (u && a <= u[1] + 1e-6) u[1] = Math.max(u[1], b); else out.push([a, b]);
  }
  return out;
}
function tirar(iv, [c0, c1]) {
  const out = [];
  for (const [a, b] of iv) {
    if (b <= c0 || a >= c1) { out.push([a, b]); continue; }
    if (a < c0) out.push([a, c0]);
    if (b > c1) out.push([c1, b]);
  }
  return out;
}
const linhaDe = ab => ab.x1 === ab.x2
  ? { o: "v", v: ab.x1, a: Math.min(ab.y1, ab.y2), b: Math.max(ab.y1, ab.y2) }
  : { o: "h", v: ab.y1, a: Math.min(ab.x1, ab.x2), b: Math.max(ab.x1, ab.x2) };
const chave = s => s.o + "|" + s.v;

// paredes = bordas dos cômodos internos, sem duplicar as compartilhadas e sem as integrações
function paredes(nivel) {
  const linhas = new Map(), cortes = new Map();
  const add = (mapa, k, a, b) => (mapa.get(k) || mapa.set(k, []).get(k)).push([a, b]);
  for (const c of nivel.comodos) {
    if (c.externo) continue;
    const x1 = c.x + c.largura, y1 = c.y + c.profundidade;
    add(linhas, "h|" + c.y, c.x, x1); add(linhas, "h|" + y1, c.x, x1);
    add(linhas, "v|" + c.x, c.y, y1); add(linhas, "v|" + x1, c.y, y1);
  }
  for (const i of nivel.integracoes || []) { const s = linhaDe(i); add(cortes, chave(s), s.a, s.b); }
  const out = [];
  for (const [k, iv] of linhas) {
    let m = juntar(iv);
    for (const c of cortes.get(k) || []) m = tirar(m, c);
    const [o, v] = k.split("|");
    for (const [a, b] of m) if (b - a > 1e-6) out.push({ o, v: +v, a, b });
  }
  return out;
}

// de que lado da parede fica a rua/quintal: +1, -1, ou 0 se a parede é interna
function ladoExterno(nivel, s) {
  const dentro = (x, y) => nivel.comodos.some(c => !c.externo && x > c.x && x < c.x + c.largura && y > c.y && y < c.y + c.profundidade);
  const m = (s.a + s.b) / 2, d = 0.2;
  const [mais, menos] = s.o === "h" ? [dentro(m, s.v + d), dentro(m, s.v - d)] : [dentro(s.v + d, m), dentro(s.v - d, m)];
  return mais && !menos ? -1 : menos && !mais ? 1 : 0;
}

function medidas(ab, externo) {
  const t = ABERTURA[ab.tipo] || ABERTURA.porta;
  // porta externa ganha bandeira de vidro em cima, como nos sobrados antigos
  return ab.tipo === "porta" && externo ? { p: 0, h: 2.55, bandeira: 2.1 } : t;
}

function moldura(s, a, b, y0, y1, lado, base, peitoril) {
  const off = lado * (ESPESSURA / 2 + 0.035), m = mat(COR.moldura), w = 0.11;
  naLinha(s.o, s.v, a - w, a, base + y0, base + y1 + w, off, 0.06, m);
  naLinha(s.o, s.v, b, b + w, base + y0, base + y1 + w, off, 0.06, m);
  naLinha(s.o, s.v, a - w, b + w, base + y1, base + y1 + w, off, 0.07, m);
  if (peitoril) naLinha(s.o, s.v, a - w, b + w, base + y0 - 0.06, base + y0, lado * (ESPESSURA / 2 + 0.06), 0.12, m);
}

function caixilho(s, a, b, y0, y1, base, cor, montantes) {
  const m = mat(cor), e = 0.05;
  naLinha(s.o, s.v, a, a + e, base + y0, base + y1, 0, 0.07, m);
  naLinha(s.o, s.v, b - e, b, base + y0, base + y1, 0, 0.07, m);
  naLinha(s.o, s.v, a, b, base + y1 - e, base + y1, 0, 0.07, m);
  naLinha(s.o, s.v, a, b, base + y0, base + y0 + e, 0, 0.07, m);
  for (let k = 1; k < montantes; k++) {
    const x = a + (b - a) * k / montantes;
    naLinha(s.o, s.v, x - e / 2, x + e / 2, base + y0, base + y1, 0, 0.06, m);
  }
  naLinha(s.o, s.v, a + e, b - e, base + y0 + e, base + y1 - e, 0, 0.02, vidro());
}

function preencherAbertura(ab, s, lado, base) {
  const { p, h, bandeira } = medidas(ab, !!lado);
  const a = s.a, b = s.b, larg = b - a, esq = fachada().esquadria;
  const ext = !!lado;
  switch (ab.tipo) {
    case "porta":
      if (ext) {
        naLinha(s.o, s.v, a + 0.02, b - 0.02, base, base + bandeira, 0, 0.05, matTex("regua", larg, bandeira, esq));
        caixilho(s, a, b, bandeira, h, base, esq, 2);
        moldura(s, a, b, 0, h, lado, base, false);
      } else {
        naLinha(s.o, s.v, a + 0.02, b - 0.02, base, base + h, 0, 0.04, mat(COR.madeira));
      }
      break;
    case "porta-vidro":
      caixilho(s, a, b, 0, h, base, esq, Math.max(2, Math.round(larg / 0.7)));
      if (ext) moldura(s, a, b, 0, h, lado, base, false);
      break;
    case "janela":
    case "janela-alta":
      caixilho(s, a, b, p, p + h, base, esq, ab.tipo === "janela" ? 2 : 1);
      if (ext) {
        moldura(s, a, b, p, p + h, lado, base, true);
        if (ab.tipo === "janela") {  // folhas de veneziana abertas rentes à fachada
          const f = larg / 2, off = lado * (ESPESSURA / 2 + 0.03), mv = matTex("veneziana", f, h, esq);
          naLinha(s.o, s.v, a - 0.11 - f, a - 0.11, base + p, base + p + h, off, 0.03, mv);
          naLinha(s.o, s.v, b + 0.11, b + 0.11 + f, base + p, base + p + h, off, 0.03, mv);
        }
      }
      break;
    case "cobogo":
      naLinha(s.o, s.v, a, b, base + p, base + p + h, 0, ESPESSURA * 0.9,
        matTex("cobogo", larg, h, 0xffffff, { transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
      if (ext) moldura(s, a, b, p, p + h, lado, base, false);
      break;
    case "portao-garagem":
      naLinha(s.o, s.v, a, b, base, base + h, 0, 0.06, matTex("regua", larg, h, esq));
      if (ext) moldura(s, a, b, 0, h, lado, base, false);
      break;
  }
}

// uma parede com seus vãos: núcleo caiado + reboco colorido do lado de fora, barrado de azulejo e cimalha
function construirParede(nivel, s, base, altura, aberturas, terreo) {
  const lado = ladoExterno(nivel, s);
  const pecas = [];
  let cheio = [[s.a, s.b]];
  for (const ab of aberturas) {
    const l = linhaDe(ab);
    const a = Math.max(l.a, s.a), b = Math.min(l.b, s.b);
    if (b - a < 1e-6) continue;
    cheio = tirar(cheio, [a, b]);
    const { p, h } = medidas(ab, !!lado);
    if (p > 0) pecas.push([a, b, 0, Math.min(p, altura)]);
    if (p + h < altura) pecas.push([a, b, p + h, altura]);
    if (!estado.baixas || p + h <= altura) preencherAbertura(ab, { ...s, a, b }, lado, base);
  }
  for (const [a, b] of cheio) pecas.push([a - ESPESSURA / 2, b + ESPESSURA / 2, 0, altura]);

  const cal = mat(COR.cal);
  for (const [a, b, y0, y1] of pecas) {
    if (y1 - y0 < 1e-3) continue;
    naLinha(s.o, s.v, a, b, base + y0, base + y1, 0, ESPESSURA, cal);
    if (!lado) continue;
    const off = lado * (ESPESSURA / 2 + 0.012);
    const corte = terreo ? Math.min(Math.max(BARRADO, y0), y1) : y0;
    if (corte > y0) naLinha(s.o, s.v, a, b, base + y0, base + corte, off, 0.024, matTex("azulejo", b - a, corte - y0));
    if (y1 > corte) naLinha(s.o, s.v, a, b, base + corte, base + y1, off, 0.024, mat(fachada().parede));
  }
  if (lado && !estado.baixas) {  // cimalha branca no alto da fachada
    naLinha(s.o, s.v, s.a - ESPESSURA / 2, s.b + ESPESSURA / 2, base + altura - 0.22, base + altura, lado * (ESPESSURA / 2 + 0.05), 0.1, mat(COR.moldura));
  }
}

// ---------- telhado colonial de duas águas: cumeeira paralela à rua, oitões nas laterais ----------
function quad(pts, uvs, material) {
  const pos = [], uv = [];
  for (const i of [0, 1, 2, 0, 2, 3]) { pos.push(...pts[i]); uv.push(...uvs[i]); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return addMesh(g, material);
}
function triangulo(pts, material) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.computeVertexNormals();
  return addMesh(g, material);
}
function telhado(t, base) {
  const inc = t.inclinacao, [b0, b1] = t.beiral, topo = base + PE_DIREITO;
  const porY = t.cumeeira === "y";
  // s = eixo do vão (cai a água), u = eixo da cumeeira
  const [s0, vao] = porY ? [t.x, t.largura] : [t.y, t.profundidade];
  const [u0, comp] = porY ? [t.y, t.profundidade] : [t.x, t.largura];
  const P = (s, u, h) => porY ? [s, h, u] : [u, h, s];
  const hb = topo + 0.06, sm = s0 + vao / 2, hr = hb + (vao / 2) * inc, k = Math.sqrt(1 + inc * inc);
  const ua = u0 - 0.15, ub = u0 + comp + 0.15;
  const mTelha = matTex("telha", 1, 1, 0xffffff, { side: THREE.DoubleSide });
  const se = s0 - b0, sf = s0 + vao + b1;
  const he = hb - b0 * inc, hf = hb - b1 * inc;
  quad([P(se, ua, he), P(sm, ua, hr), P(sm, ub, hr), P(se, ub, he)],
       [[ua, 0], [ua, (sm - se) * k], [ub, (sm - se) * k], [ub, 0]], mTelha);
  quad([P(sf, ua, hf), P(sm, ua, hr), P(sm, ub, hr), P(sf, ub, hf)],
       [[ua, 0], [ua, (sf - sm) * k], [ub, (sf - sm) * k], [ub, 0]], mTelha);
  // cumeeira e testeiras de madeira nos beirais
  const eixo = (s, h, dx, dy) => porY ? caixa(s - dx, s + dx, ua, ub, h - dy, h + dy, mat(COR.telhaCumeeira)) : caixa(ua, ub, s - dx, s + dx, h - dy, h + dy, mat(COR.telhaCumeeira));
  eixo(sm, hr + 0.04, 0.13, 0.06);
  const testeira = (s, h) => porY ? caixa(s - 0.025, s + 0.025, ua, ub, h - 0.16, h + 0.02, mat(COR.madeira)) : caixa(ua, ub, s - 0.025, s + 0.025, h - 0.16, h + 0.02, mat(COR.madeira));
  testeira(se, he); testeira(sf, hf);
  // oitões: empena triangular na cor da fachada, com friso branco acompanhando a água
  const mOitao = mat(fachada().parede, { side: THREE.DoubleSide });
  for (const u of [u0, u0 + comp]) {
    for (const d of [-ESPESSURA / 2, ESPESSURA / 2]) {
      triangulo([P(s0, u + d, topo), P(s0 + vao, u + d, topo), P(sm, u + d, hr)], mOitao);
    }
  }
}

function pergolado(pg, base) {
  const m = mat(COR.madeiraClara), y = base + pg.altura;
  caixa(pg.x + 0.05, pg.x + 0.2, pg.y, pg.y + pg.profundidade, y - 0.22, y, m);  // viga sobre os pilares
  for (let z = pg.y + 0.1; z < pg.y + pg.profundidade; z += pg.espaco) caixa(pg.x, pg.x + pg.largura, z - 0.03, z + 0.03, y, y + 0.16, m);
}

// escada em U de alvenaria com degraus de madeira
function escadaU(e, base) {
  const n = 16, r = (PE_DIREITO + LAJE) / n, larg = (e.largura - 0.2) / 2;
  const xa = e.x + 0.05, xb = e.x + e.largura - 0.05, patamar = e.y + 1;
  const passo1 = (e.y + e.profundidade - patamar) / 7, passo2 = (e.y + e.profundidade - patamar) / 8;
  const degrau = mat(COR.madeiraClara), alv = mat(COR.cal);
  for (let k = 1; k <= 7; k++) {
    const z1 = e.y + e.profundidade - (k - 1) * passo1, z0 = z1 - passo1;
    caixa(xa, xa + larg, z0, z1, base, base + k * r - 0.03, alv);
    caixa(xa, xa + larg, z0, z1 + 0.03, base + k * r - 0.03, base + k * r, degrau);
  }
  caixa(xa, xb, e.y + 0.05, patamar, base, base + 8 * r - 0.03, alv);
  caixa(xa, xb, e.y + 0.05, patamar, base + 8 * r - 0.03, base + 8 * r, degrau);
  for (let k = 9; k <= 16; k++) {
    const z0 = patamar + (k - 9) * passo2, z1 = z0 + passo2;
    caixa(xb - larg, xb, z0, z1, base, base + k * r - 0.03, alv);
    caixa(xb - larg, xb, z0 - 0.03, z1, base + k * r - 0.03, base + k * r, degrau);
  }
  caixa(xa + larg, xb - larg, patamar, e.y + e.profundidade, base, base + 8 * r + 0.9, alv);  // mureta entre os lances
}

// telha de vidro: placa clara sobre a água do telhado, no ponto da claraboia
function alturaTelhado(t, base, x, y) {
  const porY = t.cumeeira === "y";
  const s = porY ? x : y, s0 = porY ? t.x : t.y, vao = porY ? t.largura : t.profundidade;
  const hb = base + PE_DIREITO + 0.06;
  return hb + Math.min(s - s0, s0 + vao - s) * t.inclinacao;
}
function claraboia(c, t, base) {
  const P = (x, y) => [x, alturaTelhado(t, base, x, y) + 0.035, y];
  const x1 = c.x + c.largura, y1 = c.y + c.profundidade;
  quad([P(c.x, c.y), P(x1, c.y), P(x1, y1), P(c.x, y1)], [[0, 0], [1, 0], [1, 1], [0, 1]],
       mat(0xdcedf3, { transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
}

const GIRO = { "+y": 0, "+x": Math.PI / 2, "-y": Math.PI, "-x": -Math.PI / 2 };
function movel(mv, base) {
  const montar = MONTAR[mv.tipo];
  if (!montar) return;
  const deitado = mv.frente === "+x" || mv.frente === "-x";
  const W = deitado ? mv.profundidade : mv.largura, D = deitado ? mv.largura : mv.profundidade;
  const g = new THREE.Group();
  montar(g, W, D, mv);
  g.position.set(mv.x + mv.largura / 2, base + 0.02, mv.y + mv.profundidade / 2);
  g.rotation.y = GIRO[mv.frente] || 0;
  g.traverse(o => { if (o.isMesh) { o.castShadow = !o.material.transparent; o.receiveShadow = true; } });

}

  cv.width = Math.ceil(Math.max(w1, w2) + 28 * esc); cv.height = 64 * esc;
  g.fillStyle = "rgba(255,255,255,0.9)";
  g.beginPath(); g.roundRect ? g.roundRect(0, 0, cv.width, cv.height, 10 * esc) : g.rect(0, 0, cv.width, cv.height); g.fill();
  g.textAlign = "center"; g.fillStyle = "#1c2220"; g.font = f1; g.fillText(texto, cv.width / 2, 28 * esc);
  g.fillStyle = "#4f5955"; g.font = f2; g.fillText(sub, cv.width / 2, 53 * esc);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.userData.descartavel = true;
  const alt = 0.8;
  sp.scale.set(alt * cv.width / cv.height, alt, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 10;
  grupo.add(sp);
}

const fmt = v => String(+v.toFixed(2)).replace(".", ",");
const ehEscada = c => /^escada/i.test(c.nome);

function corPlanta(c) {
  if (c.externo) return COR.externo;
  return c.status === "reformado" ? COR.reformado : COR.existente;
}
function piso(c) {
  if (estado.cores) return mat(corPlanta(c));
  const n = c.nome.toLowerCase();
  const tipo = /banh|cozinha|despensa|serviço/.test(n) ? "ladrilho" : /garagem/.test(n) ? "cimento" : /varanda|gourmet/.test(n) ? "tijoleira" : "taco";
  return matTex(tipo, c.largura, c.profundidade);
}

function construir() {
  scene.remove(grupo);
  grupo.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.userData.descartavel) { o.material.map.dispose(); o.material.dispose(); }
  });
  grupo = new THREE.Group();
  scene.add(grupo);

  const niveis = CENARIOS[estado.cenario];
  const visiveis = niveis.map((_, i) => estado.andar === "todos" || +estado.andar === i);
  const ultimoVisivel = visiveis.lastIndexOf(true);
  const altura = estado.baixas ? PAREDE_BAIXA : PE_DIREITO;
  const baseDe = i => i * (PE_DIREITO + LAJE) + (estado.separar ? i * 3 : 0);

  niveis.forEach((nivel, i) => {
    if (!visiveis[i]) return;
    const base = baseDe(i);

    for (const c of nivel.comodos) {
      if (i > 0 && ehEscada(c)) continue;  // vão da escada
      const x1 = c.x + c.largura, z1 = c.y + c.profundidade;
      if (i > 0) caixa(c.x, x1, c.y, z1, base - LAJE, base, mat(COR.laje));
      caixa(c.x, x1, c.y, z1, base, base + 0.02, piso(c));
    }

    const ab = nivel.aberturas || [];
    for (const s of paredes(nivel)) construirParede(nivel, s, base, altura, ab.filter(a => chave(linhaDe(a)) === chave(s)), i === 0);

    // guarda-corpo de cobogó nas áreas externas do andar de cima (onde não há parede)
    if (i > 0) {
      const ocupadas = new Map();
      for (const s of paredes(nivel)) (ocupadas.get(chave(s)) || ocupadas.set(chave(s), []).get(chave(s))).push([s.a, s.b]);
      for (const c of nivel.comodos.filter(c => c.externo)) {
        const x1 = c.x + c.largura, z1 = c.y + c.profundidade;
        for (const s of [{ o: "h", v: c.y, a: c.x, b: x1 }, { o: "h", v: z1, a: c.x, b: x1 }, { o: "v", v: c.x, a: c.y, b: z1 }, { o: "v", v: x1, a: c.y, b: z1 }]) {
          let livre = [[s.a, s.b]];
          for (const iv of ocupadas.get(chave(s)) || []) livre = tirar(livre, iv);
          for (const [a, b] of livre) {
            if (b - a < 0.05) continue;
            naLinha(s.o, s.v, a, b, base, base + 1.0, 0, 0.1, matTex("cobogo", b - a, 1.0, 0xffffff, { transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
            naLinha(s.o, s.v, a - 0.06, b + 0.06, base + 1.0, base + 1.06, 0, 0.14, mat(COR.moldura));
          }
        }
      }
    }

    for (const e of nivel.escadas || []) escadaU(e, base);
    for (const el of nivel.elementos || []) {
      const m = el.material === "tijolo" ? mat(COR.tijolo) : mat(COR.bancada);
      const y0 = base + (el.base || 0);
      caixa(el.x, el.x + el.largura, el.y, el.y + el.profundidade, y0, y0 + el.altura - (el.base || 0), m);
    }
    for (const pg of nivel.pergolados || []) if (!estado.baixas) pergolado(pg, base);
    if (estado.moveis) for (const mv of nivel.moveis || []) movel(mv, base);
    if (estado.telhado && !estado.baixas) {
      for (const t of nivel.telhados || []) telhado(t, base);
      if (nivel.telhados && nivel.telhados[0]) for (const c of nivel.claraboias || []) claraboia(c, nivel.telhados[0], base);
    }

    if (i === 0) {
      for (const m of nivel.muros || []) {
        const s = linhaDe(m);
        const cobogo = m.tipo === "cobogo", alt = cobogo ? 2.2 : 1.8;
        const portao = /portão/i.test(m.nome) ? [4.5, 7.5] : null;
        let trechos = [[s.a, s.b]];
        if (portao) trechos = tirar(trechos, portao);
        for (const [a, b] of trechos) {
          const mm = cobogo ? matTex("cobogo", b - a, alt, 0xffffff, { transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }) : mat(fachada().parede);
          naLinha(s.o, s.v, a, b, 0, alt, 0, cobogo ? 0.1 : 0.15, mm);
          naLinha(s.o, s.v, a - 0.04, b + 0.04, alt, alt + 0.06, 0, 0.2, mat(COR.moldura));
        }
        if (portao) naLinha(s.o, s.v, portao[0], portao[1], 0.03, 1.9, 0, 0.06, matTex("regua", portao[1] - portao[0], 1.9, fachada().esquadria));
      }
      for (const [px, pz] of nivel.pilares || []) caixa(px - 0.15, px + 0.15, pz - 0.15, pz + 0.15, 0, PE_DIREITO, mat(COR.pilar));
    }

    if (estado.rotulos && (i === ultimoVisivel || estado.separar)) {
      for (const c of nivel.comodos) {
        rotulo(c.nome, `${fmt(c.largura)} × ${fmt(c.profundidade)} m · ${fmt(c.largura * c.profundidade)} m²`,
               c.x + c.largura / 2, base + altura + (estado.telhado ? 2.6 : 0.45), c.y + c.profundidade / 2);
      }
    }
  });
  lista(niveis, visiveis);
}

// ---------- painel ----------
function lista(niveis, visiveis) {
  const el = document.getElementById("lista");
  let html = "";
  niveis.forEach((nivel, i) => {
    if (!visiveis[i]) return;
    const titulo = niveis.length > 1 ? NOME_ANDAR[i] : (nivel.titulo || "Planta atual");
    let total = 0;
    html += `<h2>${titulo}</h2><ul>`;
    for (const c of nivel.comodos) {
      const a = c.largura * c.profundidade;
      if (!c.externo) total += a;
      html += `<li><span class="nome"><span class="cor" style="background:${hex(corPlanta(c))}"></span>${c.nome}</span><span>${fmt(a)} m²</span></li>`;
    }
    html += `<li class="total"><span>Área interna</span><span>${fmt(total)} m²</span></li></ul>`;
  });
  html += `<h2>Linguagem da casa</h2><dl>
    <div><dt>Telhado colonial</dt><dd>Duas águas de telha de barro, cumeeira paralela à rua, oitões nas laterais e beiral com testeira de madeira.</dd></div>
    <div><dt>Fachada caiada e colorida</dt><dd>Reboco nas cores de Olinda e do Recife Antigo, cimalha e molduras brancas nas portas e janelas.</dd></div>
    <div><dt>Barrado de azulejo</dt><dd>Azulejo azul e branco até 90 cm na fachada do térreo.</dd></div>
    <div><dt>Esquadrias de madeira</dt><dd>Janelas com venezianas abertas e portas com bandeira de vidro, pintadas em cor forte.</dd></div>
    <div><dt>Cobogó</dt><dd>Invenção pernambucana: ilumina a escada, faz o guarda-corpo da varanda e o muro da área gourmet.</dd></div>
    <div><dt>Telha de vidro</dt><dd>Nos cômodos do térreo sem parede para fora, a luz entra pelo telhado, como nas casas antigas do interior.</dd></div>
    <div><dt>Rede e chita</dt><dd>Rede de dormir na varanda e colchas de chita nos quartos.</dd></div>
    <div><dt>Pisos</dt><dd>Taco de madeira nos quartos e salas, ladrilho hidráulico nas áreas molhadas, tijoleira no quintal e varanda.</dd></div>
  </dl>
  <p class="nota">Medidas de portas, janelas e móveis são estimadas. As laterais têm construções vizinhas: no térreo não há janelas laterais; no 1º andar, sim. A área de serviço aparece retangular, mas é triangular.</p>`;
  el.innerHTML = html;
}

// ---------- controles ----------
const segFachadas = document.getElementById("fachadas");
segFachadas.innerHTML = Object.entries(FACHADAS).map(([k, f]) =>
  `<button id="f-${k}" data-f="${k}" title="${f.nome}" aria-label="Fachada ${f.nome}"><span class="amostra" style="background:${hex(f.parede)}"><i style="background:${hex(f.esquadria)}"></i></span><span class="rot">${f.nome}</span></button>`).join("");

function sincronizar() {
  for (const b of document.querySelectorAll("#cenarios button")) b.setAttribute("aria-pressed", b.dataset.c === estado.cenario);
  for (const b of document.querySelectorAll("#fachadas button")) b.setAttribute("aria-pressed", b.dataset.f === estado.fachada);
  const temAndar = CENARIOS[estado.cenario].length > 1;
  if (!temAndar) estado.andar = "todos";
  for (const b of document.querySelectorAll("#andares button")) {
    b.disabled = !temAndar && b.dataset.a !== "todos";
    b.setAttribute("aria-pressed", b.dataset.a === estado.andar);
  }
  document.getElementById("separar").disabled = !temAndar;
  construir();
}
document.getElementById("cenarios").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  estado.cenario = b.dataset.c; sincronizar();
});
document.getElementById("andares").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  estado.andar = b.dataset.a; sincronizar();
});
segFachadas.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  estado.fachada = b.dataset.f; sincronizar();
});
for (const id of ["telhado", "moveis", "separar", "baixas", "rotulos", "cores"]) {
  const el = document.getElementById(id);
  el.addEventListener("change", () => { estado[id] = el.checked; construir(); });
}

let enquadrado = false;
function redimensionar() {
  const { clientWidth: w, clientHeight: h } = cena;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!enquadrado) {  // enquadra a casa uma vez; depois a câmera é do usuário
    const dist = 23 * Math.max(1, 1.25 / camera.aspect);
    camera.position.copy(controls.target).addScaledVector(DIRECAO_CAMERA, dist);
    controls.update();
    enquadrado = true;
  }
  // rótulos das fachadas só cabem por extenso em telas largas
  for (const r of document.querySelectorAll("#fachadas .rot")) r.hidden = document.body.clientWidth < 1100;
}
new ResizeObserver(redimensionar).observe(cena);
redimensionar();

(function animar() {
  requestAnimationFrame(animar);
  controls.update();
  renderer.render(scene, camera);
})();

sincronizar();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(construir);
</script>
